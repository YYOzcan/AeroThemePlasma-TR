<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- AeroThemePlasma: Windows 7 yazı tipleri yoksa açık lisanslı muadilleri kullan.
     Gerçek Segoe UI / Lucida Console kurulursa onlar önceliklidir (accept = yedek). -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Light</family><accept><family>Selawik Light</family></accept></alias>
  <alias binding="same"><family>Segoe UI Semilight</family><accept><family>Selawik Semilight</family></accept></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><accept><family>Selawik Semibold</family></accept></alias>
  <alias binding="same"><family>Lucida Console</family><accept><family>DejaVu Sans Mono</family></accept></alias>
  <!-- Segoe UI için ATP'nin uyguladığı tam ipucu (hintfull) ayarını Selawik'e de uygula -->
  <match target="font">
    <test name="family" qual="any"><string>Selawik</string></test>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintfull</const></edit>
  </match>
  <!-- TerminalVector bir bitmap kopyasıdır; keskin görünmesi için yumuşatmayı kapat -->
  <match target="font">
    <test name="family" qual="any"><string>TerminalVector</string></test>
    <edit mode="assign" name="antialias"><bool>false</bool></edit>
    <edit mode="assign" name="hinting"><bool>false</bool></edit>
  </match>
</fontconfig>
